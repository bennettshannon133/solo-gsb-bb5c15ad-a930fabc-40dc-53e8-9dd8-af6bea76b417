services:
  color-delta-e:
    build: .
    image: printing-delta-e:latest
    container_name: printing-delta-e
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)\" || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
