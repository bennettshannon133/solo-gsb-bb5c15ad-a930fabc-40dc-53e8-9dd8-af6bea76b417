services:
  proof-delta-e-api:
    build: .
    image: proof-delta-e-api:latest
    container_name: proof-delta-e-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert json.load(response)['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
